<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard Check</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #212121;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            width: 100%;
            background-color: #ffffff;
        }

        nav a {
            background-color: #e0e0e0;
            color: #000000;
            padding: 8px 16px;
            text-decoration: none;
            border: 1px solid #999999;
            border-radius: 2px;
            font-size: 14px;
        }

        .project {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
            width: 100%;
        }

        .key {
            font-size: 18px;
            text-align: center;
        }

        table,
        th,
        td {
            border: 1px solid #ffffff;
            border-collapse: collapse;
            padding: 10px 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="project">
        <div id="insert">
            <div class="key">Press the key and watch magic</div>
        </div>
    </div>

</body>
<script>
    const insert = document.querySelector('#insert')

    window.addEventListener('keydown', (e) => {
        insert.innerHTML = `
        <div class='color'>
            <table>
                <tr>
                    <th>key</th>
                    <th>keycode</th>
                    <th>code</th>
                </tr>
                <tr>
                    <td>${e.key === " " ? 'Space' : e.key}</td>
                    <td>${e.keyCode}</td>
                    <td>${e.code}</td>
                </tr>
            </table>

        </div>
        `
    })
</script>

</html>
