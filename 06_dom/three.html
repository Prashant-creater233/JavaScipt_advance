<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chai with code</title>
</head>
<body style="background-color: #212121; color: white;">
    
</body>
<script>
    const div = document.createElement('div');
    console.log(div);
    div.className = "main"
    div.id = Math.round(Math.random() * 10 + 1)
    div.setAttribute("title", "generated title")
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    // div.innerText = "prashant kanwal"
    const addText = document.createTextNode("prashant kanwal")
    div.appendChild(addText)

    const creatediv = document.body.appendChild(div)

    creatediv.innerText = "Prashant Kanwal"

    // ye same kaam lop sa hitnhi baar print krana ho
    for (let i = 0; i < 5; i++) {

        const div = document.createElement('div');

        console.log(div);

        div.className = "main";

        div.id = Math.round(Math.random() * 10 + 1);

        div.setAttribute("title", "generated title");

        div.style.backgroundColor = "green";

        div.style.padding = "12px";

        div.style.margin = "10px";

        div.style.color = "white";

        const addText = document.createTextNode("Prashant Kanwal");

        div.appendChild(addText);

        document.body.appendChild(div);
    }
    
</script>
</html>
