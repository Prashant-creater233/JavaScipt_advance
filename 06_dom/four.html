<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chai aur code</title>
</head>
<body style="background-color: #212121; color: white;">
    <ul class="language">
        <li>javascript</li>
    </ul>
</body>
<script>
    function addLanuage(langName){
        const li = document.createElement('li');
        li.innerText = `${langName}`
        document.querySelector('.language').appendChild(li)
    }

    addLanuage("python")
    addLanuage("typescript")


    // optimize approach travelsing nhi hotti uper wala me hoti ha
    function addOptiLanuage(langName){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    addOptiLanuage("golang")


    // Edit
    const secondLarg = document.querySelector("li:nth-child(2)")
    //1st approach
    // secondLarg.innerHTML = "Mojo"

    // 2nd approach
    const newli = document.createElement('li')
    newli.textContent = "Mojo"
    secondLarg.replaceWith(newli)

    // edit
    const firstLang = document.querySelector('li:first-child')
    firstLang.outerHTML = '<li>TypeScript</li>'

    //remove
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()


</script>
</html>
